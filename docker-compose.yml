services:
  # The Database Service
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=phoebudget
    ports:
      - "5433:5432" # Expose port locally so you can still inspect with a GUI tool
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./migrations:/docker-entrypoint-initdb.d # DISABLE THIS: The API now handles migrations!

      # Your Rust App Service
  api:
    build: .
    restart: on-failure
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=phoebudget
      - JWT_SECRET=MY_SECRETTT
      - RUST_LOG=info
      - LOG_REQUEST_BODY=1
      - LOG_REQUEST_BODY_LEVEL=info
      - REDIS_URL=redis://redis:6379
      - ITICK_API_KEY=${ITICK_API_KEY}
      - RUN_MIGRATIONS=0
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}

  migrate:
    build: .
    depends_on:
      - db
    command: ./server
    environment:
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=phoebudget
      - REDIS_URL=redis://redis:6379
      - RUN_MIGRATIONS=1
      - RUN_MIGRATIONS_ONLY=1

  # Redis Service for Job Queue
  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Scheduler Service
  scheduler:
    build: .
    command: ./scheduler
    restart: on-failure
    depends_on:
      - db
      - redis
    environment:
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=phoebudget
      - REDIS_URL=redis://redis:6379
      - RUST_LOG=info

  # Worker Service
  worker:
    build: .
    command: ./worker
    restart: on-failure
    depends_on:
      - db
      - redis
    environment:
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=phoebudget
      - REDIS_URL=redis://redis:6379
      - RUST_LOG=info

volumes:
  postgres_data:
  redis_data:
