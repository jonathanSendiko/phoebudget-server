server {
    listen 80;
    listen [::]:80;
    server_name budget.phoebius.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name budget.phoebius.cloud;

    ssl_certificate /etc/letsencrypt/live/budget.phoebius.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/budget.phoebius.cloud/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Force dynamic DNS resolution for Docker service names
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream "api:3000";

    location / {
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
